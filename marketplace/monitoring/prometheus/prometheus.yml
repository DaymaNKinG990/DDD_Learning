global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Catalog Service
  - job_name: 'catalog'
    static_configs:
      - targets: ['catalog:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Orders Service
  - job_name: 'orders'
    static_configs:
      - targets: ['orders:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Users Service
  - job_name: 'users'
    static_configs:
      - targets: ['users:8003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Auth Service
  - job_name: 'auth'
    static_configs:
      - targets: ['auth:8004']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Reviews Service
  - job_name: 'reviews'
    static_configs:
      - targets: ['reviews:8005']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Notifications Service
  - job_name: 'notifications'
    static_configs:
      - targets: ['notifications:8006']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: '/metrics'
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "alerts.yml" 