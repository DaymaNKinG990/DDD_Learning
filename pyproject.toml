[project]
name = "ddd-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "stripe>=7.0.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.0.0",
    "httpx>=0.25.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.2.0",
    "asyncpg>=0.30.0",
    "prometheus-client>=0.22.1",
    "pytest-xdist>=3.8.0",
    "pytest-coverage>=0.0",
    "bcrypt>=4.3.0",
    "aiohttp>=3.9.0",
    "jsonschema>=4.0.0",
]

[tool.ruff]
line-length = 88
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "Q",
]
ignore = ["D100", "D104", "D106", "D203", "D212", "D415"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=ddd_course --cov-report=term-missing --cov-report=xml"
testpaths = [
    "ddd_course"
]
pythonpath = [
    "ddd_course"
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.12"
packages = ["ddd_course"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    '\\.venv',
    'venv',
    'docs',
    'build',
    'dist',
    '.*migrations.*',
]
